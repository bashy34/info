    border:1.5px solid rgba(245,245,240,.25);background:rgba(245,245,240,.05);color:var(--text);transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .primary{background:var(--lime);border-color:var(--lime);color:var(--bg)}
  .hint{font-size:13px;color:var(--muted);margin:-2px 0 14px}
  .work{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 18px;flex-wrap:wrap}
  .worklabel{font-size:14px;color:var(--muted)}
  .workpill{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--text);font-size:15px;font-weight:700;
    padding:8px 14px;border-radius:999px;border:1px solid rgba(200,255,61,.45);background:rgba(200,255,61,.08)}
  .workpill em{font-style:normal;font-weight:300;color:var(--muted);font-size:13px}

  /* --- רשת נוירונים ברקע --- */
  .fx{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  .net{position:absolute;inset:0;width:100%;height:100%}
  .net .ln{stroke:rgba(245,245,240,.13);stroke-width:.18}
  .net .flow{stroke:var(--lime);stroke-width:.45;stroke-linecap:round;
    stroke-dasharray:3 60;animation-name:signal;animation-timing-function:linear;animation-iteration-count:infinite;opacity:.9}
  @keyframes signal{from{stroke-dashoffset:63}to{stroke-dashoffset:0}}
  .net .nd{fill:rgba(245,245,240,.5);animation:blink 4s ease-in-out infinite}
  .net .nd.big{fill:var(--lime);animation:blinkbig 4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:.9}}
  @keyframes blinkbig{0%,100%{opacity:.5;r:1.8}50%{opacity:1;r:2.3}}
  main{position:relative;z-index:1}
  .up{opacity:0;transform:translateY(16px);animation:up .55s cubic-bezier(.2,.8,.2,1) forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}
  .d5{animation-delay:.45s}.d6{animation-delay:.55s}.d7{animation-delay:.65s}
  @keyframes up{to{opacity:1;transform:none}}
  .rotator{display:inline-block;height:1.3em;overflow:hidden;vertical-align:-.28em}
  .rotator ul{list-style:none;padding:0;margin:0;animation:roll 9s cubic-bezier(.8,0,.2,1) infinite}
  .rotator li{height:1.3em;line-height:1.3em;color:var(--lime)}
  @keyframes roll{0%,22%{transform:translateY(0)}33%,55%{transform:translateY(-1.3em)}
    66%,88%{transform:translateY(-2.6em)}100%{transform:translateY(-3.9em)}}
  .primary{position:relative;overflow:hidden}
  .primary::after{content:"";position:absolute;top:0;bottom:0;width:60%;left:-70%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 3.2s ease-in-out infinite}
  @keyframes shine{0%{left:-70%}45%{left:120%}100%{left:120%}}
  @media (prefers-reduced-motion:reduce){
    .net .flow,.net .nd,.net .nd.big,.primary::after,.rotator ul{animation:none}
    .up{opacity:1;transform:none;animation:none}}
  .proof{margin-top:24px;font-size:15px;color:var(--muted)}
  .proof a{color:var(--text)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-left:6px;box-shadow:0 0 0 4px rgba(200,255,61,.2)}
  #toast{position:fixed;bottom:28px;right:50%;transform:translateX(50%);background:var(--lime);color:var(--bg);font-weight:700;
    padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s}
  #toast.show{opacity:1}
</style>
